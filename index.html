<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silver Arrow Quotes</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">
      <div class="header-inner">
        <h1>명언 추천</h1>
      </div>
    </header>

    <!-- =========================
         Main
    ========================== -->
    <main class="page-main">
      <!-- =========================
           Random Quote
      ========================== -->
      <section class="random-section" aria-labelledby="randomTitle">
        <div class="section-header">
          <h2 id="randomTitle">랜덤 명언 추천</h2>
        </div>

        <article class="random-card">
          <p id="randomQuote" class="random-quote">
            CSV 데이터를 불러오는 중입니다...
          </p>

          <div class="random-info">
            <button
              id="randomAuthor"
              class="random-author"
              type="button"
              disabled
            >
              -
            </button>
            <p id="randomMeta" class="random-meta">-</p>
          </div>

          <button id="randomBtn" class="random-btn" type="button">
            다른 명언 보기
          </button>
        </article>
      </section>

      <!-- =========================
           Quote Cards
      ========================== -->
      <section class="quote-section" aria-labelledby="quoteListTitle">
        <div class="section-header">
          <h2 id="quoteListTitle">명언 목록 카드</h2>
        </div>

        <div id="quoteViewer" class="quote-viewer">
          <article class="loading-card">
            <p>명언 데이터를 불러오는 중입니다...</p>
          </article>
        </div>
      </section>
    </main>

    <!-- =========================
         Author Modal
    ========================== -->
    <div id="authorModal" class="author-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>

      <article
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalAuthorName"
      >
        <button class="modal-close-btn" type="button" data-close-modal>
          ×
        </button>

        <p class="modal-label">저자 프로필</p>

        <h2 id="modalAuthorName" class="modal-author-name">저자 이름</h2>

        <div class="modal-meta">
          <div>
            <span>출생일</span>
            <strong id="modalBornDate">-</strong>
          </div>

          <div>
            <span>출생지</span>
            <strong id="modalBornLocation">-</strong>
          </div>
        </div>

        <p id="modalDescription" class="modal-description">
          저자 소개를 불러오는 중입니다.
        </p>

        <a
          id="modalAuthorLink"
          class="modal-author-link"
          href="#"
          target="_blank"
        >
          원본 저자 페이지 보기
        </a>
      </article>
    </div>

    <noscript>
      <div class="noscript-message">
        이 페이지는 JavaScript를 사용하여 CSV 데이터를 불러옵니다. 브라우저에서
        JavaScript를 활성화해주세요.
      </div>
    </noscript>
  </body>
</html>
